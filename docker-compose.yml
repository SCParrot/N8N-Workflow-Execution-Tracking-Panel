version: '3.8'

services:
  n8n-tracker:
    # Build image
    build:
      context: .
      dockerfile: Dockerfile
    # Container name
    container_name: n8n-tracker
    # Restart policy
    restart: unless-stopped
    # Port mapping
    ports:
      - "3000:3000"
    # Environment variables (optional, used to override config file)
    environment:
      - NODE_ENV=production
    # Volume mapping for persistent configuration
    volumes:
      - ./config:/app/config
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "
        const http = require('http');
        const req = http.request({ hostname: 'localhost', port: 3000, path: '/', method: 'HEAD' }, (res) => {
          process.exit(res.statusCode === 200 ? 0 : 1);
        });
        req.on('error', () => process.exit(1));
        req.end();
      "]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
    # Network configuration
    networks:
      - n8n-tracker-network

# Network configuration
networks:
  n8n-tracker-network:
    driver: bridge
